# 정책과 문구. 고객이 정하지 않은 기준(가정)은 여기서 바꾼다.

issuer:
  name: 샘플세무법인
  footer: 샘플세무법인 발행

report:
  title: 법인세 분석 보고서
  sections:
    key_metrics: 1. 주요 지표 비교
    charts: 2. 그래프
    comments: 3. 요약 코멘트
    income_comparison: 4. 요약 손익 비교
    sga: 5. 판관비 주요 항목
    tax_notes: 6. 세무조정 특이사항
    financial_notes: 7. 재무제표 주요 특이사항
    assumptions: 8. 가정·확인 필요 목록
    evidence: 9. 근거 목록
  chart_titles:
    income: 전기·당기 주요 손익 비교
    sga_pie: 판관비 구성비율
    sga_bars: 판관비 주요 항목 전기·당기 비교
    balance: 재무상태 비교
  chart_unit_label: 금액 (만원)
  balance_table_title: 재무상태 비교
  assumptions_title: 가정
  needs_check_title: 확인 필요
  needs_check_none: 확인이 필요한 항목이 없습니다.
  unit_note_key: "단위: 1억원 이상은 억원, 1억원 미만은 만원 (반올림)"
  unit_note_won: "단위: 원"
  missing_text: 확인 필요

units:
  eok_threshold: 100000000
  eok_decimals: 2
  rounding: half_up        # 가정 A1 (half_up | down)

debt_ratio:
  decimals: 2
  negative_equity_label: 자본잠식

sga:
  top_n: 5                 # 확정 R5
  other_label: 기타
  total_label: 판매비와관리비 합계
  selection: current_amount_desc   # 가정 A8
  share_decimals: 2
  # 표준서식의 항목 이름이 묶음 이름(other_label)과 같을 때 구분해 적는 틀 (가정 A9)
  same_name_template: "{name}({form} {label})"

comparison:
  turnaround_label: 흑자전환       # 확정 R6
  not_applicable: "-"
  rate_decimals: 1

# 글꼴 탐색 순서: assets/fonts/*.ttf → font_path → font_fallbacks. 못 찾으면 오류로 멈춘다.
font_path: null
font_fallbacks:
  - /System/Library/Fonts/Supplemental/AppleGothic.ttf

labels:
  key_metrics:
    revenue: 매출액
    operating_income: 영업이익
    net_income: 당기순이익
    debt_ratio: 부채비율
  income_comparison:      # 요약 손익 비교의 행 순서
    - {key: revenue, label: 매출액}
    - {key: gross_profit, label: 매출총이익}
    - {key: operating_income, label: 영업손익}
    - {key: non_operating_income, label: 영업외수익}
    - {key: non_operating_expense, label: 영업외비용}
    - {key: pretax_income, label: 법인세차감전손익}
    - {key: income_tax, label: 법인세비용}
    - {key: net_income, label: 당기순이익}
  balance_comparison:
    - {key: total_assets, label: 자산총계}
    - {key: total_liabilities, label: 부채총계}
    - {key: total_equity, label: 자본총계}
  sga_total: 판매비와관리비
  cogs: 매출원가

# 보고서에 그대로 적는 가정 목록
assumptions:
  - "금액을 억원·만원으로 줄여 쓸 때 끝자리는 반올림했습니다."
  - "부채비율은 부채총계 ÷ 자본총계 × 100으로 계산했습니다."
  - "자본총계가 음수인 사업연도의 부채비율은 «자본잠식»으로 적고 계산값을 괄호로 함께 적었습니다. 한쪽이 자본잠식이면 부채비율 증감은 계산하지 않았습니다."
  - "증감률은 (당기 - 전기) ÷ |전기| × 100입니다. 전기가 0이거나 전기·당기 중 음수가 있으면 «-»로 적었습니다(전기 음수 → 당기 양수는 «흑자전환»)."
  - "판관비 주요 항목은 표준손익계산서의 당기 금액이 큰 순서로 5개를 골랐고, 나머지는 «기타»로 묶었습니다."
  - "전기 금액은 전기 세무조정계산서의 표준서식에서 읽었습니다."
  - "요약 코멘트와 특이사항은 서식에 적힌 수치만으로 만든 문장이며, 변동 사유는 포함하지 않았습니다."

comments:
  titles:
    profitability: 매출 및 수익성
    sga: 판관비 주요 항목
    non_operating: 영업외손익
    changes: 전년 대비 주요 변동
    ratios: 재무비율(부채비율)
    credits: 공제·감면

# 문장 틀. {이름} 자리에 값이 들어간다. 금액은 «…원»으로 끝난다.
templates:
  revenue: "{cy}년 매출액은 {current}으로, {py}년 {prior} 대비 증감액은 {change}입니다(증감률: {rate})."
  profit: "영업손익은 {py}년 {prior_op}에서 {cy}년 {current_op}으로, 당기순손익은 {py}년 {prior_ni}에서 {cy}년 {current_ni}으로 바뀌었습니다."
  margins: "{cy}년 매출액 대비 영업손익 비율은 {op_margin}, 당기순손익 비율은 {ni_margin}입니다."
  sga_total: "{cy}년 판매비와관리비는 {current}으로, {py}년 {prior} 대비 증감액은 {change}입니다. 매출액 대비 비중은 {py}년 {prior_share}, {cy}년 {current_share}입니다."
  sga_top: "당기 금액이 가장 큰 항목은 {label}({amount}, 매출액 대비 {share})입니다."
  sga_next: "그다음은 {label2}({amount2}), {label3}({amount3}) 순입니다."
  non_operating_total: "{cy}년 영업외수익은 {income}, 영업외비용은 {expense}입니다. {py}년은 영업외수익 {prior_income}, 영업외비용 {prior_expense}입니다."
  non_operating_item: "{cy}년 {category} 계정 중 {label}에 {amount}이 있습니다."
  non_operating_none: "{cy}년 영업외수익·영업외비용의 세부 계정에 금액이 없습니다."
  change_income: "손익 항목 중 증감액이 가장 큰 항목은 {label}이며, 증감액은 {change}입니다({py}년 {prior} → {cy}년 {current})."
  change_sga: "판관비 항목 중 증감액이 가장 큰 항목은 {label}이며, 증감액은 {change}입니다({py}년 {prior} → {cy}년 {current})."
  debt_ratio: "부채비율은 {py}년 {prior}, {cy}년 {current}입니다."
  debt_ratio_basis: "{cy}년 부채총계는 {liabilities}, 자본총계는 {equity}입니다. 부채비율은 부채총계 ÷ 자본총계 × 100으로 계산했습니다(가정)."
  credit_item: "{cy}년 {name}({basis})으로 {amount}을 감면·공제했습니다."
  credit_summary: "산출세액 {calculated}에서 공제·감면을 반영한 총부담세액은 {total}입니다."
  credit_none: "{cy}년 공제감면세액 합계표에 금액이 적힌 항목이 없습니다."
  credit_no_form: "{cy}년 세무조정계산서에 공제감면세액 합계표가 없습니다."

  adjustment_item: "{year}년 {subject} {amount}을 {kind}했습니다(소득처분: {disposition})."
  adjustment_item_no_disposition: "{year}년 {subject} {amount}을 {kind}했습니다."
  adjustment_none: "{year}년은 세무조정 사항이 없습니다."
  adjustment_count: "{year}년은 소득금액조정 항목이 {count}건 있습니다."
  adjustment_unread: "{year}년 세액조정계산서에 익금산입·손금산입 금액이 있으나 소득금액조정합계표를 찾지 못했습니다. 확인이 필요합니다."
  loss_used: "{year}년 과세표준 계산에서 이월결손금 {amount}을 공제했습니다."
  loss_origin: "공제한 결손금의 발생 사업연도 종료일은 {year_end}이고 발생액은 {incurred}입니다."
  loss_mismatch: "{py}년 세액조정계산서의 과세표준 결손액은 {tax_base}이고, 자본금과적립금조정명세서(갑)의 {py}년 발생 결손금은 {incurred}입니다. 두 금액의 차이는 {diff}이며 확인이 필요합니다."
  credit_note: "{year}년 {name}({basis}) 감면세액은 {amount}입니다."
  minimum_tax: "{year}년 최저한세는 {minimum}, 감면 후 세액은 {after}입니다."
  tax_summary: "{year}년 과세표준은 {tax_base}, 산출세액은 {calculated}, 총부담세액은 {total}입니다."

  negative_equity: "{year}년 말 자본총계는 {equity}으로 자본잠식 상태입니다."
  negative_equity_resolved: "{py}년 말 자본총계 {prior}(자본잠식)에서 {cy}년 말 {current}으로 바뀌어 자본잠식이 해소됐습니다."
  officer_borrowings: "주주·임원·직원단기차입금(결산서의 가수금) 잔액은 {py}년 말 {prior}, {cy}년 말 {current}이며 증감액은 {change}입니다."
  officer_borrowings_settle: "{cy}년 말 자본총계가 {equity}이므로, 자본잠식을 해소하려면 가수금 등으로 정리해야 할 금액은 {needed}입니다(가정: 자본총계의 절댓값)."
  officer_loans: "주주·임원·직원 대여금(가지급금) 잔액은 {cy}년 말 {current}이며 매출액 대비 {ratio}입니다."
  receivables: "외상매출금 잔액은 {py}년 말 {prior}, {cy}년 말 {current}이며, {cy}년 매출액 대비 {ratio}입니다."
  receivables_partners: "{cy}년 말 외상매출금명세서에 잔액이 있는 거래처는 {count}곳입니다."
  debt_ratio_note: "부채비율은 {py}년 {prior}, {cy}년 {current}입니다."

